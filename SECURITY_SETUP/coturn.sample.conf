# CONTOH SAJA. Jangan gunakan secret/domain/sertifikat contoh dalam production.
listening-port=3478
tls-listening-port=5349
realm=turn.your-real-domain.example
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_LONG_RANDOM_SECRET
cert=/etc/letsencrypt/live/turn.your-real-domain.example/fullchain.pem
pkey=/etc/letsencrypt/live/turn.your-real-domain.example/privkey.pem
no-loopback-peers
no-multicast-peers
min-port=49160
max-port=49200
